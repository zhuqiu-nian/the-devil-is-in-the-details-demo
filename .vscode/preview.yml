autoOpen: false
apps:
  - port: 8000
    run: |
      python -m pip install -r backend/requirements.txt
      test -d external/stf || git clone --depth 1 https://github.com/Googolxx/STF external/stf
      python -m pip install -e external/stf
      test -d external/compressai_zoo_pkg/compressai || python -m pip install --target external/compressai_zoo_pkg --no-deps compressai==1.2.8
      python scripts/download_kodak.py
      python -m uvicorn backend.app:app --host 0.0.0.0 --port 8000
    root: ./
    name: STF Compression Backend
    description: FastAPI inference API for the STF image-compression demo
    autoOpen: false
    autoPreview: false
  - port: 5173
    run: |
      npm install
      npm run dev -- --host 0.0.0.0 --port 5173
    root: ./frontend
    name: STF Compression Web Demo
    description: React dashboard for local-detail image-compression comparison
    autoOpen: true
    autoPreview: true

