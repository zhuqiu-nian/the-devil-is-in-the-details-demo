autoOpen: true
apps:
  - port: 8000
    run: |
      python scripts/cloud_setup.py
      npm --prefix frontend install
      npm --prefix frontend run build
      python -m uvicorn backend.app:app --host 0.0.0.0 --port 8000
    root: ./
    name: STF Compression Web Demo
    description: Single-port FastAPI + React image-compression demo
    autoOpen: true
    autoPreview: true
